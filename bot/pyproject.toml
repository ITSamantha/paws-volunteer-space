[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paw-volunteer-bot"
version = "0.1.0"
description = "Telegram bot of ITMO's Helping Paws club: delivers notifications and talks to the Paw Volunteer Space API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "aiokafka>=0.15,<1",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "fluent-runtime>=0.4,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17",
    "mypy>=2.4",
    "testcontainers[kafka,postgres]>=4.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "C4", "SIM", "RUF",
    "S",
    "ASYNC",
    "PT",
]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: проверки на настоящих PostgreSQL и Kafka в Docker"]
pythonpath = ["src"]
